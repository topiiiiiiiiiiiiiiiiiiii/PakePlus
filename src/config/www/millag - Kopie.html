function startDialog(sp,lines){

function initTasks(){
S.tasks=DAY_TASKS[Math.min(S.day,DAY_TASKS.length-1)].slice();
S.tasksDone=[];S.tasksCompleteShown=false;renderTasks()}

function completeTask(id){
if(!S.tasks.includes(id))return;
if(S.tasksDone.includes(id))return;
S.tasksDone.push(id);renderTasks();toast('TASK DONE');
S.stress=Math.max(0,S.stress-3);checkAllTasksDone()}

function checkAllTasksDone(){
if(S.tasksCompleteShown)return;
var all=true;
for(var i=0;i<S.tasks.length;i++)if(S.tasksDone.indexOf(S.tasks[i])===-1){all=false;break}
if(all){S.tasksCompleteShown=true;showObjective('TASKS COMPLETE');
S.money+=10;updateMoney();setTimeout(function(){toast('ALL TASKS DONE — +$10')},200)}}

function renderTasks(){
var el=document.getElementById('tasksInner');el.innerHTML='';
for(var i=0;i<S.tasks.length;i++){var t=S.tasks[i],done=S.tasksDone.indexOf(t)!==-1;
var d=document.createElement('div');d.className='task'+(done?' done':'');
d.innerHTML='<span class="box"></span>'+TASK_TEXT[t];el.appendChild(d)}
checkAllTasksDone()}

function showEnding(kind){

var title,text;
if(kind==='BURNOUT'){title='BURNOUT';text='The screen blurs. The walls close in. You stand up, walk out, and never come back.';
if(window.NLConnect)window.NLConnect.trigger('burnout',S.playerName+' hat aufgegeben.',S.playerName)}
else if(kind==='GOOD'){title='THE WEEK IS OVER';
if(S.affection>=80)text='Friday, 5:00 PM. You survived. And you found something. Jessica is waiting outside. She smiles. Monday is coming. But you won\'t face it alone.';
else if(S.daveQuestResult==='talk')text='Friday, 5:00 PM. You survived. Dave is still here. He talked to his wife. Small things count.';
else if(S.daveQuestResult==='sent')text='Friday, 5:00 PM. Dave sent the email. He is leaving in two weeks. He meant it.';
else text='Friday, 5:00 PM. It was a week. Just a week.';
if(window.NLConnect)window.NLConnect.trigger('survived',S.playerName+' hat die Woche überlebt.',S.playerName)}
else{title='SURVIVED';text='Friday, 5:00 PM. Some tasks remained. But you\'re still here.'}
var aff=S.affection>0?'<br>JESSICA: <b class="pink">'+Math.min(100,Math.floor(S.affection))+'%</b>':'';
box.innerHTML='<h1>'+title+'</h1><h2>'+S.playerName+' — End of Week</h2>'+'<p>'+text+'</p>'+
'<div class="stats">TASKS: <b>'+S.tasksDone.length+'</b><br>STRESS: <b>'+Math.floor(S.stress)+'%</b><br>MONEY: <b>$'+S.money+'</b><br>DAYS: <b>'+Math.min(S.day+1,5)+'</b>'+aff+'</div>'+
'<button class="btn" onclick="location.reload()">MONDAY AGAIN</button>';
ov.classList.add('on')}
